<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Egregore</title>
<style>
  :root { --ink: #e8e4dc; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: var(--ink); overflow: hidden;
    font: 400 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { cursor: none; }
  body.ui { cursor: default; }

  #gl, #fallbackVideo {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; background: #000;
  }
  #gl { z-index: 1; }

  /* Hidden decode surfaces. Kept in-document (not display:none) so browsers
     keep decoding them; 1px and behind everything. */
  .src {
    position: fixed; left: 0; top: 0; width: 2px; height: 2px;
    opacity: 0.001; pointer-events: none; z-index: 0;
  }

  /* Plain-video fallback (no WebGL2): both elements visible, CSS crossfade. */
  body.nogl .src {
    position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0;
    object-fit: cover; transition: opacity 1.6s linear; z-index: 1;
  }
  body.nogl #gl { display: none; }

  .veil {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 22px; opacity: 1;
    /* A scrim, not a curtain: the dream is already running behind it. */
    background: radial-gradient(ellipse at center,
                rgba(0,0,0,.42) 0%, rgba(0,0,0,.72) 55%, rgba(0,0,0,.92) 100%);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    transition: opacity 900ms ease;
  }
  #join { background: rgba(0,0,0,.88); }
  .veil[hidden] { display: none; }
  .veil.out { opacity: 0; pointer-events: none; }

  .mark {
    width: 64px; height: 64px; border-radius: 50%;
    border: 1px solid rgba(232,228,220,.28);
    box-shadow: 0 0 60px rgba(232,228,220,.06) inset;
    animation: breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: scale(1);    opacity: .55; }
    50%     { transform: scale(1.12); opacity: .95; }
  }
  .word {
    letter-spacing: .42em; text-transform: uppercase; font-size: 11px;
    color: rgba(232,228,220,.5); padding-left: .42em;
  }
  .hint { font-size: 11px; color: rgba(232,228,220,.28); letter-spacing: .16em; text-transform: uppercase; }

  #join form { display: flex; gap: 8px; }
  #join input, #join button {
    font: inherit; font-size: 13px; letter-spacing: .08em;
    background: rgba(255,255,255,.045); color: var(--ink);
    border: 1px solid rgba(232,228,220,.18); border-radius: 2px;
    padding: 10px 14px; outline: none;
  }
  #join input:focus { border-color: rgba(232,228,220,.45); }
  #join button { cursor: pointer; background: rgba(255,255,255,.08); }
  #join button:hover { background: rgba(255,255,255,.14); }
  #joinErr { font-size: 11px; color: #d98b7a; min-height: 1em; letter-spacing: .1em; }

  #hud {
    position: fixed; left: 10px; top: 10px; z-index: 30;
    font: 400 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: rgba(232,228,220,.72); background: rgba(0,0,0,.45);
    border: 1px solid rgba(232,228,220,.12); border-radius: 3px;
    padding: 7px 9px; white-space: pre; pointer-events: none;
  }
  #hud[hidden] { display: none; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>

  <video id="vidA" class="src" muted playsinline autoplay loop preload="auto" disablepictureinpicture></video>
  <video id="vidB" class="src" muted playsinline autoplay loop preload="auto" disablepictureinpicture></video>

  <!-- Tap-to-enter: requests fullscreen, but the render runs regardless. -->
  <div class="veil" id="enter">
    <div class="mark"></div>
    <div class="word">Egregore</div>
    <div class="hint">tap to enter</div>
  </div>

  <!-- Password veil: only shown on 401. -->
  <div class="veil" id="join" hidden>
    <div class="mark"></div>
    <div class="word">Egregore</div>
    <form id="joinForm" autocomplete="off">
      <input id="joinPass" type="password" placeholder="password" aria-label="Party password" autocomplete="current-password">
      <button type="submit">enter</button>
    </form>
    <div id="joinErr"></div>
  </div>

  <pre id="hud" hidden></pre>

  <script type="module" src="/static/lens.js"></script>
</body>
</html>
