# Demo preset — runs the full pipeline with no mic, no GPU, no API key.
# A scripted conversation drives the real ring buffer, weaver, validator,
# governor, forge (procedural local renderer), loom, and lens.

party:
  name: "Demo Dream"
  duration_hours: 1.0

aesthetic:
  grammar: |
    Abstract, symbolic, non-representational. Deep saturated color,
    organic forms dissolving into geometric ones. Movement slow and
    liquid, never cutting, never frantic. Suggest meaning without
    depicting it: no readable text, no recognizable faces, no literal
    objects from the described themes. The register is reverent and
    mysterious, closer to stained glass and deep-sea bioluminescence
    than to psychedelia-as-decoration.
  drift: 0.4

generation:
  backend: "mock"
  clip_duration_s: 8
  fallback: "mock"

budget:
  total_usd: 0            # zero-budget mode: no cloud calls possible

continuity:
  default_mode: "mosaic"
  loop_half_life_min: 10  # scaled to the short demo run
  active_pool_max: 60

asr:
  engine: "fixture"

zones:
  - id: "main"
    mic: { type: "fixture" }   # uses the built-in demo conversation
    lens_stack: ["flow", "feedback", "bloom"]
    screens: ["screen-1"]

screens:
  - id: "screen-1"
    loop_phase_offset: 0.0

privacy:
  ring_buffer_minutes: 5
  signage_required: false     # demo only; real presets keep this true

serving:
  bind: "0.0.0.0:8420"

demo_time_scale: 8            # scripted conversation plays 8x faster
