# ---------------------------------------------------------------------------
# DEMO — no hardware at all. A scripted conversation, procedural video.
#
#   uv run egregore run presets/demo.yaml
#   open http://localhost:8420/?zone=main
#
# The first thing to run after installing: it proves the server, the
# screens, the effects and the whole prompt pipeline without a microphone,
# a GPU, a model, or a key. Nothing is spent and nothing leaves the machine.
# ---------------------------------------------------------------------------

party:
  name: "Demo"
  duration_hours: 1

aesthetic:
  abstraction: 0.5
  room_bias: 0.5

generation:
  backend: "procedural"
  fallback: "none"
  clip_duration_s: 8
  fill_duration_s: 12

budget:
  total_usd: 0

continuity:
  default_mode: "mosaic"
  loop_half_life_min: 10
  active_pool_max: 60

asr:
  engine: "fixture"

zones:
  - id: "main"
    mic: { type: "fixture" }          # the built-in scripted conversation
    playback_rate: 0.7
    hold_s: 15
    crossfade_s: 4
    lens_stack: ["flow", "smoke", "bloom"]
    screens: ["screen-1"]

screens:
  - id: "screen-1"

privacy:
  signage_required: false             # demo only; real presets keep this on

serving:
  bind: "0.0.0.0:8420"

demo_time_scale: 8                    # the scripted conversation plays 8x faster
