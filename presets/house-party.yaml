# House party / salon — 1–2 zones, 2–3 screens, 4–6 hours, modest budget.
party:
  name: "House Party"
  duration_hours: 5

aesthetic:
  grammar: |
    Abstract, symbolic, non-representational. Deep saturated color,
    organic forms dissolving into geometric ones. Movement slow and
    liquid. Warmth over spectacle: candlelight, amber, dusk blues.
    Suggest meaning without depicting it — no readable text, no
    recognizable faces, no literal objects from the described themes.
  drift: 0.4

generation:
  backend: "auto"           # cloud while budget lasts, then local/mock
  model: "veo-3.1-lite"
  clip_duration_s: 8
  fallback: "mock"

budget:
  total_usd: 60.00
  spend_curve:
    - { at: "0%",   rate: 0.5 }
    - { at: "30%",  rate: 1.2 }
    - { at: "60%",  rate: 1.5 }
    - { at: "85%",  rate: 0.8 }
    - { at: "100%", rate: 0.3 }

continuity:
  default_mode: "mosaic"
  loop_half_life_min: 36    # ~12% of run length
  active_pool_max: 200

asr:
  engine: "parakeet"

zones:
  - id: "living-room"
    mic: { type: "usb", device: "default" }
    lens_stack: ["flow", "feedback", "bloom"]
    screens: ["projector", "corner-tv"]

screens:
  - id: "projector"
    loop_phase_offset: 0.0
  - id: "corner-tv"
    lens_stack: ["liquid", "chroma"]
    loop_phase_offset: 0.5

privacy:
  ring_buffer_minutes: 5
  signage_required: true

serving:
  bind: "0.0.0.0:8420"
