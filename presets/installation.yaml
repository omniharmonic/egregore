# Durational installation — runs for days on the local backend at zero
# marginal cost, accumulating an enormous loop. No cloud calls possible.
party:
  name: "Installation"
  duration_hours: 72

aesthetic:
  grammar: |
    Geological patience. Abstract strata, sediment, slow crystallization,
    tidal light. The imagery accretes rather than performs. Movement at
    the pace of weather. No readable text, no faces, no literal objects.
  drift: 0.7                # wander associatively over the long run

generation:
  backend: "local"          # ComfyUI / LTX-2 on operator hardware
  clip_duration_s: 8
  fallback: "mock"

budget:
  total_usd: 0              # hard-zero: the ledger refuses every cloud cent

continuity:
  default_mode: "mosaic"
  loop_half_life_min: 520   # ~12% of 72h so recency stays meaningful
  loop_floor_weight: 0.05
  active_pool_max: 400

asr:
  engine: "parakeet"

zones:
  - id: "gallery"
    mic: { type: "usb", device: "default" }
    lens_stack: ["liquid", "flow", "feedback"]
    screens: ["gallery-wall"]

screens:
  - id: "gallery-wall"
    loop_phase_offset: 0.0

privacy:
  ring_buffer_minutes: 5
  signage_required: true

serving:
  bind: "0.0.0.0:8420"
