# Live room, fal video. Real microphone, real transcripts, MiniMax clips.
#
#   uv run egregore run presets/live-fal.yaml --ignore-settings
#
# Tuned for a room with people and music in it:
#  - 6s clips, so each one has somewhere to go and the loop is not frantic
#  - a long loop half-life, so good clips stay in rotation and the pool grows
#    into something continuous rather than cycling two clips
#  - crossfade 3s against 6s clips, so transitions are unhurried

party:
  name: "Live Room"
  duration_hours: 3.0

aesthetic:
  grammar: |
    Abstract, symbolic, non-representational. Deep saturated color,
    organic forms dissolving into geometric ones. Movement slow and
    liquid, never cutting, never frantic. Suggest meaning without
    depicting it: no readable text, no recognizable faces, no literal
    objects from the described themes. The register is reverent and
    mysterious, closer to stained glass and deep-sea bioluminescence
    than to psychedelia-as-decoration.
  drift: 0.45

generation:
  backend: "fal"
  fal_model: "minimax-h3-max"
  resolution: "768p"        # richer than 480p; $0.08/s standard
  clip_duration_s: 6
  fallback: "procedural"    # never let the room go dark

budget:
  # ~$0.29 per 6s clip at the promo rate, ~$0.96 reserved. Raise this to keep
  # generating for longer; the ceiling is hard and cannot be exceeded.
  total_usd: 15.0

continuity:
  default_mode: "mosaic"
  topology: "independent"
  loop_half_life_min: 45    # clips stay in rotation, so the loop deepens
  loop_floor_weight: 0.2    # even old clips keep a real chance of playing
  active_pool_max: 120

asr:
  engine: "parakeet"
  language: "en"

zones:
  - id: "main"
    mic: { type: "usb", device: null }   # null = system default input
    playback_rate: 0.7
    crossfade_s: 4.0
    lens_stack: ["flow", "feedback", "bloom", "crt"]
    screens: ["screen-1"]

screens:
  - id: "screen-1"
    loop_phase_offset: 0.0

privacy:
  ring_buffer_minutes: 6
  signage_required: true

serving:
  bind: "0.0.0.0:8420"

clip_store_dir: "var/clips-live-fal"
