# Live local — real microphone, real on-device transcription, real diffusion.
# Nothing derived from speech leaves this machine.
#
#   ASR    : Parakeet TDT 0.6B, int8 ONNX via CoreML (~8x realtime on an M2 Max)
#   Video  : ComfyUI + LTX-Video 2B on this box
#   Cadence: self-pacing — the Governor reads the backend's observed render
#            time, so this same file behaves sanely on a laptop or a 4090.
#
# macOS: the terminal running this needs Microphone permission
# (System Settings -> Privacy & Security -> Microphone).

party:
  name: "Live Dream"
  duration_hours: 3.0

aesthetic:
  grammar: |
    Abstract, symbolic, non-representational. Deep saturated color,
    organic forms dissolving into geometric ones. Movement slow and
    liquid, never cutting, never frantic. Suggest meaning without
    depicting it: no readable text, no recognizable faces, no literal
    objects from the described themes.
  drift: 0.4

generation:
  backend: "local"
  clip_duration_s: 4
  fallback: "procedural"
  comfyui_url: "http://127.0.0.1:8188"

budget:
  total_usd: 0

continuity:
  default_mode: "mosaic"
  loop_half_life_min: 20
  active_pool_max: 60

asr:
  engine: "parakeet"
  language: "en"

zones:
  - id: "main"
    mic: { type: "usb", device: null }   # null = system default input
    lens_stack: ["flow", "feedback", "glitch", "crt"]
    screens: ["screen-1"]

screens:
  - id: "screen-1"
    loop_phase_offset: 0.0

privacy:
  ring_buffer_minutes: 5
  signage_required: true

serving:
  bind: "0.0.0.0:8420"

clip_store_dir: "var/clips-live"
