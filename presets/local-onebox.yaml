# ONE-BOX LOCAL — the whole system on a single machine with a decent GPU.
# No cloud calls are possible (zero budget = the ledger refuses every cent).
# Transcription, theme abstraction, and video generation all run locally:
#
#   ASR    faster-whisper small/int8 (or Parakeet if NeMo is installed)
#   LLM    any OpenAI-compatible local server — Ollama shown here
#          (ollama pull qwen3:14b && ollama serve)
#   VIDEO  ComfyUI + LTX-2 headless at :8188; if it is down or slow, the
#          procedural renderer (pure ffmpeg, zero GPU) keeps the dream fed.
#
# The imagery leans more abstract than the cloud tier — that is the intended
# trade, not a degraded mode. Nothing derived from speech ever leaves the box.

party:
  name: "One Box"
  duration_hours: 6

aesthetic:
  grammar: |
    Abstract, symbolic, non-representational. Deep saturated color,
    organic forms dissolving into geometric ones. Movement slow and
    liquid. Lean into pure abstraction: fields, gradients, flow,
    interference patterns. Suggest meaning without depicting it —
    no readable text, no recognizable faces, no literal objects.
  drift: 0.5

generation:
  backend: "local"            # ComfyUI / LTX-2
  comfyui_url: "http://127.0.0.1:8188"
  local_model: "ltx-2"
  clip_duration_s: 8
  fallback: "procedural"      # ffmpeg renderer: always available, costs nothing

budget:
  total_usd: 0                # structurally no cloud

asr:
  engine: "faster-whisper"    # runs on modest GPU or CPU; parakeet also works
  language: "en"

weaver:
  engine: "llm"
  llm:
    base_url: "http://localhost:11434/v1"   # Ollama
    model: "qwen3:14b"

continuity:
  default_mode: "mosaic"
  loop_half_life_min: 43
  active_pool_max: 250

zones:
  - id: "main"
    mic: { type: "usb", device: "default" }
    lens_stack: ["flow", "feedback", "bloom"]
    screens: ["main-screen"]

screens:
  - id: "main-screen"
    loop_phase_offset: 0.0

privacy:
  ring_buffer_minutes: 5
  signage_required: true      # use the LOCAL-MODE signage — the stronger claim

serving:
  bind: "0.0.0.0:8420"
