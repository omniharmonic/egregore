# The local party: this machine listens, this machine dreams, nothing leaves.
#
#   EGREGORE_MONITOR=1 uv run egregore run presets/local-party.yaml --ignore-settings
#
# Needs ComfyUI on :8188 with the LTX-Video graphs (docs/local-hardware.md).
# Everything else — microphone, transcription, diffusion, compositing — runs
# here. budget 0 means no cloud backend can be reached even if a key is set.
#
# Tuned for a room rather than a demo:
#  - continuity, so each clip is seeded from the last one's final frame and a
#    movement reads as one long shot instead of a series of cuts
#  - playback at 0.7 with a four-second dissolve, so the loop pulses
#  - the procedural renderer fills the minutes between diffusion clips, and
#    is weighted below them so it reads as connective tissue

party:
  name: "Local Party"
  duration_hours: 6.0

aesthetic:
  grammar: |
    Abstract, symbolic, non-representational. Deep saturated color,
    organic forms dissolving into geometric ones. Movement slow and
    liquid, never cutting, never frantic. Suggest meaning without
    depicting it: no readable text, no recognizable faces, no literal
    objects from the described themes. The register is reverent and
    mysterious, closer to stained glass and deep-sea bioluminescence
    than to psychedelia-as-decoration.
  drift: 0.45
  abstraction: 0.85          # mostly abstract, with some material still legible

generation:
  backend: "local"           # ComfyUI + LTX-Video on this machine
  clip_duration_s: 4         # 97 latent frames, the fastest LTXV rung
  fallback: "procedural"     # never let the room go dark
  # How hard this machine works per clip. Tuned for an Apple-silicon laptop:
  # a 4s clip lands in roughly two minutes, so imagery still belongs to the
  # conversation that shaped it. On a bigger GPU raise both — and you can do
  # it from the dashboard while the party runs, no restart. Leave either
  # blank to use whatever your own ComfyUI workflow file specifies.
  local_steps: 8
  local_resolution: "512x320"

budget:
  total_usd: 0               # structurally cannot reach any cloud

continuity:
  default_mode: "continuity" # seed each clip from the last one's final frame
  topology: "independent"
  loop_half_life_min: 40     # clips stay in rotation, so the loop deepens
  loop_floor_weight: 0.2
  active_pool_max: 120
  max_chain_length: 8        # a movement, then a fresh start

asr:
  engine: "parakeet"
  language: "en"

zones:
  - id: "main"
    mic: { type: "usb", device: null }   # null = system default input
    playback_rate: 0.7
    crossfade_s: 4.0
    lens_stack: ["flow", "smoke", "feedback", "bloom"]
    screens: ["screen-1"]

screens:
  - id: "screen-1"
    loop_phase_offset: 0.0

privacy:
  ring_buffer_minutes: 6
  signage_required: true

serving:
  bind: "0.0.0.0:8420"

clip_store_dir: "var/clips-local-party"

weaver:
  # Which of the things the room said becomes the next clip. Weighted blend;
  # the sliders on the dashboard change these live, per zone.
  selection:
    # Measured on the first live run: with salience at 0.5 a long thought
    # from 165s earlier beat a fresh one, and the clip landed 282s behind
    # the room on a 116s render. Recency-forward keeps the screen with the
    # conversation; salience still breaks ties toward what was dwelt on.
    salience: 0.35      # what the room dwelt on
    novelty: 0.2        # lower than default: a continuity chain wants coherence
    recency: 0.45       # what was said most recently
    segment_gap_s: 6.0  # a pause this long ends one thought and starts the next
