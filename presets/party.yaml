# A party: several rooms, microphones supplied by whoever walks in.
#
#   uv run egregore run presets/party.yaml
#
# Guests open the address printed at startup on their phone and choose
# whether the device listens, shows, or both. The operator watches
# /static/setup.html, where every node can be muted or removed.
#
# topology: commons — every microphone in the building feeds one transcript
# pool, and each room still renders its own loop. Set "independent" for rooms
# that dream only their own conversation, or "mirror" for one loop everywhere.

party:
  name: "Party"
  duration_hours: 6.0

aesthetic:
  grammar: |
    Abstract, symbolic, non-representational. Deep saturated color,
    organic forms dissolving into geometric ones. Movement slow and
    liquid, never cutting, never frantic. Suggest meaning without
    depicting it: no readable text, no recognizable faces, no literal
    objects from the described themes.
  drift: 0.4

generation:
  backend: "procedural"
  clip_duration_s: 8
  fallback: "none"

budget:
  total_usd: 0

continuity:
  default_mode: "mosaic"
  topology: "commons"
  loop_half_life_min: 25
  active_pool_max: 80

asr:
  engine: "parakeet"
  language: "en"

zones:
  - id: "kitchen"
    mic: { type: "network" }
    lens_stack: ["flow", "feedback", "bloom"]
    screens: ["kitchen-screen"]
  - id: "dance-floor"
    mic: { type: "network" }
    lens_stack: ["flow", "glitch", "chroma", "crt"]
    screens: ["dance-screen"]
  - id: "garden"
    mic: { type: "network" }
    lens_stack: ["liquid", "feedback", "bloom"]
    screens: ["garden-screen"]

screens:
  - id: "kitchen-screen"
    loop_phase_offset: 0.0
  - id: "dance-screen"
    loop_phase_offset: 0.33
  - id: "garden-screen"
    loop_phase_offset: 0.66

privacy:
  ring_buffer_minutes: 5
  signage_required: true

serving:
  bind: "0.0.0.0:8420"

clip_store_dir: "var/clips-party"
