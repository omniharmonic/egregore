# Two rooms, two conversations, two dreams. Each zone hears only its own
# microphones and renders its own loop — topology: independent.
#
#   uv run egregore run presets/two-rooms.yaml --ignore-settings
#
# Both zones take their audio from enrolled browsers, so a phone in the
# kitchen feeds the kitchen and a phone in the workshop feeds the workshop.

party:
  name: "Two Rooms"
  duration_hours: 1.0

aesthetic:
  grammar: |
    Abstract, symbolic, non-representational. Deep saturated color,
    organic forms dissolving into geometric ones. Movement slow and
    liquid, never cutting, never frantic. Suggest meaning without
    depicting it: no readable text, no recognizable faces, no literal
    objects from the described themes.
  drift: 0.4

generation:
  backend: "procedural"
  clip_duration_s: 6
  fallback: "none"

budget:
  total_usd: 0

continuity:
  default_mode: "mosaic"
  topology: "independent"
  loop_half_life_min: 30
  active_pool_max: 60

asr:
  engine: "parakeet"
  language: "en"

zones:
  - id: "kitchen"
    mic: { type: "network" }
    lens_stack: ["flow", "feedback", "bloom"]
    screens: ["kitchen-screen"]
  - id: "workshop"
    mic: { type: "network" }
    lens_stack: ["glitch", "chroma", "crt"]
    screens: ["workshop-screen"]

screens:
  - id: "kitchen-screen"
    loop_phase_offset: 0.0
  - id: "workshop-screen"
    loop_phase_offset: 0.5

privacy:
  ring_buffer_minutes: 6
  signage_required: false

serving:
  bind: "0.0.0.0:8420"

clip_store_dir: "var/clips-two-rooms"
