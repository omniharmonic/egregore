# ---------------------------------------------------------------------------
# TWO ROOMS — phones as microphones, one screen per room.
#
#   uv run egregore run presets/two-rooms.yaml
#
# Guests open http://<this-machine>:8420 on a phone, pick a room and
# "transmit"; that phone becomes the room's microphone. Each room dreams its
# own loop. Change topology to "commons" for one shared conversation with a
# loop per room, or "mirror" for one loop on every screen.
# ---------------------------------------------------------------------------

party:
  name: "Two Rooms"
  duration_hours: 5

aesthetic:
  abstraction: 0.5
  room_bias: 0.5

generation:
  backend: "local"
  fallback: "procedural"
  clip_duration_s: 4
  fill_duration_s: 12
  local_quality: "balanced"

weaver:
  engine: "auto"
  selection: { salience: 0.35, novelty: 0.2, recency: 0.45, segment_gap_s: 6 }

budget:
  total_usd: 0

continuity:
  default_mode: "continuity"
  max_chain_length: 8
  topology: "independent"

asr:
  engine: "parakeet"

zones:
  - id: "kitchen"
    mic: { type: "network" }          # phones that enrol as "kitchen" transmitters
    playback_rate: 0.7
    hold_s: 20
    crossfade_s: 4
    lens_stack: ["flow", "smoke", "bloom"]
    screens: ["kitchen-screen"]
  - id: "lounge"
    mic: { type: "network" }
    playback_rate: 0.7
    hold_s: 20
    crossfade_s: 4
    lens_stack: ["liquid", "bloom", "crt"]
    screens: ["lounge-screen"]

screens:
  - id: "kitchen-screen"              # ?zone=kitchen&screen=kitchen-screen
  - id: "lounge-screen"               # ?zone=lounge&screen=lounge-screen
    loop_phase_offset: 0.5

privacy:
  ring_buffer_minutes: 6
  signage_required: true

serving:
  bind: "0.0.0.0:8420"

clip_store_dir: "var/clips-two-rooms"
